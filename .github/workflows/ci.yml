name: ci

# Quality gates for every push to main and every pull request. The steps are
# exactly the make targets of the AGENTS.md project contract, so a local
# `make check` and CI run the same commands on the same locked dependencies:
#   1. make lint       ruff check, ruff format --check, shellcheck agent/*.sh
#   2. make typecheck  mypy --strict on app/
#   3. make test       pytest default selection with the coverage gate
# No db_integration/acceptance/integration/bench tests: the default selection
# excludes them via pytest.ini `addopts` and the path-based auto-marker in
# tests/conftest.py, so it runs without Postgres or Docker.

on:
  push:
    branches: [main]
  pull_request:

# A new commit on the same ref cancels the previous run instead of
# burning CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · tests
    runs-on: fathometer
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read the uv version from the Dockerfile
        id: uv
        run: |
          version="$(awk '$1 == "FROM" && $NF == "uv" { sub(/^.*:/, "", $2); print $2 }' Dockerfile)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ steps.uv.outputs.version }}

      - name: Install dependencies (uv.lock)
        run: make install

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        # Postgres-dependent tests skip themselves when no test DB is
        # reachable; CI configures none. The 73 % gate is the pure-unit
        # default selection's level with a jitter buffer.
        run: make test
