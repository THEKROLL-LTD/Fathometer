[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    error
    ignore::DeprecationWarning:flask_limiter.*
    ignore::ResourceWarning:psycopg.*
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    bench: Performance mini-bench (Block M, ADR-0020). Excluded from the default selection.
    integration: Docker/E2E integration test (Block N, ADR-0021). Excluded from the default selection.
    acceptance: Test against a real Postgres or live services. Excluded from the default selection; runs only during RC preparation. Auto-marked via tests/conftest.py.
    db_integration: Test that deliberately exercises real DB/migration/transaction semantics and is not meaningfully mockable. Excluded from the default selection.
    todo_mock: Test that still uses a real DB but should be refactored to mocks. Stays active; marked only so it can be found again.
# The default selection is the only one an agent may run unattended. Note it is
# not strictly pure-unit: todo_mock tests stay in by design and touch a real
# Postgres when one is up. `pytest -m "not todo_mock"` is the pure subset.
# Heavy suites run on explicit user instruction by overriding -m on the CLI, e.g.
#   pytest -m db_integration --timeout=300
# A later -m / --timeout on the CLI wins over the values set here.
addopts = -ra --strict-markers --timeout=30 --timeout-method=thread -m "not bench and not integration and not acceptance and not db_integration"
